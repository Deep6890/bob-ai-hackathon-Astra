submission:
  title: "AeroReady — Mission Readiness & Predictive Maintenance Platform"

  problem_statement: >
    Unplanned aircraft-on-ground (AOG) events cost fleet operators millions per day.
    Maintenance crews rely on fixed time-based schedules that either waste resources or
    miss genuine degradation. There is no fast, data-driven way to ask "Is this engine
    safe for today's mission?" and receive a justified, sensor-evidence-backed answer.

  solution_summary: >
    AeroReady ingests raw turbofan sensor telemetry, runs a dual-model ML pipeline
    (LSTM for RUL prediction + Isolation Forest for per-sensor anomaly detection),
    and produces a go/no-go mission readiness decision with an explicit margin of safety.
    A conversational Mission Readiness Copilot accessible via web UI and IBM Bob MCP
    tools lets operators ask natural-language questions and receive answers grounded
    exclusively in real ML pipeline output.

  key_features:
    - "LSTM RUL prediction (MAE 10.05 cycles, R² 0.897) trained on NASA C-MAPSS turbofan data with 5-fold Group K-Fold cross-validation"
    - "Isolation Forest sensor health monitoring classifying 14 sensors as NORMAL, DEGRADING, ABNORMAL, or UNKNOWN against a healthy-engine baseline"
    - "Mission readiness engine computing margin-of-safety = RUL minus mission_duration, issuing SAFE/MARGINAL/CRITICAL go/no-go decisions"
    - "Evidence-grounded Mission Readiness Copilot answering natural-language questions about RUL, sensor health, and maintenance priority with no LLM"
    - "IBM Bob MCP integration exposing 5 tools (get_fleet_summary, get_engine_readiness, get_sensor_health, list_high_priority_engines, ask_copilot)"

  tech_stack:
    languages: ["Python 3.11", "JavaScript ES2022"]
    frameworks: ["Flask 3.0", "React 18", "Vite", "TailwindCSS", "SQLAlchemy", "FastMCP"]
    ibm_technologies: ["IBM Bob (MCP integration via FastMCP)"]
    databases: ["SQLite (dev)", "PostgreSQL (production-compatible via DATABASE_URL)"]
    other: ["PyTorch 2.x", "scikit-learn", "NASA C-MAPSS dataset", "Recharts", "Lucide React", "Waitress", "Flask-Migrate"]

  what_we_are_most_proud_of: >
    The end-to-end rigour of the ML pipeline: a rigorously validated LSTM
    (5-fold Group K-Fold, MAE 10.05, R² 0.897) combined with a baseline-grounded
    Isolation Forest that classifies 14 turbofan sensors against a healthy reference
    population, feeding a mission-window readiness engine that produces actionable
    go/no-go decisions with explicit safety margins. The entire system is surfaced
    through a clean React dashboard, a deterministic evidence-grounded Copilot,
    and IBM Bob MCP tools that make the complete fleet interrogable in natural language
    without any paid API dependency.

  known_limitations: >
    Models trained on NASA C-MAPSS FD001 only (single operating condition, single fault
    mode). Per-sensor anomaly scores are multivariate ensemble scores, not independent
    per-sensor scores. The Copilot uses deterministic NL generation, not a generative
    LLM. No authentication layer — demo use only. SQLite default; configure
    DATABASE_URL for PostgreSQL in production.

